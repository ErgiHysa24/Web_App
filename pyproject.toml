[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdog-risk-assessor"
version = "1.4.0"
description = "WatchDog: risk assessment di sicurezza per Linux (ogni distribuzione) e macOS"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ergi Hysa" }]
keywords = ["security", "risk-assessment", "linux", "macos", "audit", "hardening", "wazuh", "mitre-attack"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.12"
dependencies = [
    "paramiko>=2.10.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
security = [
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/ErgiHysa24/WatchDog_riskAssessment"
Changelog = "https://github.com/ErgiHysa24/WatchDog_riskAssessment/blob/main/CHANGELOG.md"
Issues = "https://github.com/ErgiHysa24/WatchDog_riskAssessment/issues"

[project.scripts]
watchdog-assessor = "risk_assessor.cli:main"
risk-assessor = "risk_assessor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
risk_assessor = ["reports/banners/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]
# B108: "/tmp" compare solo come PERCORSO DA ANALIZZARE sul target (ClamAV, filesystem
# collector, config), il tool non crea mai file temporanei in /tmp.
skips = ["B108"]
