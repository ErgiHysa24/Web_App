{% extends "base.html" %}
{% block title %}Scegli la tua password{% endblock %}
{% block content %}
<h1>Scegli la tua password</h1>
<p class="lead">La password che stai usando l'ha impostata un amministratore. Prima di continuare scegline una che conosci solo tu.</p>
{% if error %}<div class="note error" role="alert"><p>{{ error }}</p></div>{% endif %}
<form method="post" action="/account/password">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="current">Password attuale</label><input type="password" id="current" name="current" required autocomplete="current-password">
  <label for="new">Nuova password <span class="hint">Almeno 12 caratteri. Una frase di più parole è facile da ricordare e difficile da indovinare.</span></label><input type="password" id="new" name="new" required autocomplete="new-password">
  <label for="repeat">Ripeti la nuova password</label><input type="password" id="repeat" name="repeat" required autocomplete="new-password">
  <p class="mt"><button class="btn" type="submit">Salva la nuova password</button></p>
</form>
{% endblock %}
